<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1480" viewBox="0 0 1920 1480"><title>Konzept eines dialogbasierten Szenarioassistenten</title><rect width="1920" height="1480" fill="#F4F7FB"/><rect x="0" y="0" width="1920" height="126" rx="0" fill="#FFFFFF"/><text x="54" y="59.96" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#233951">SyntheSis</text><text x="54" y="98.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#64748B">Szenarioassistent · Dortmund / Unna</text><rect x="1578" y="37" width="282" height="48" rx="22" fill="#FFF1DA"/><text x="1601" y="67.16" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9A5900">KONZEPTBEISPIEL</text><rect x="40" y="154" width="1170" height="1272" rx="20" fill="#FFFFFF"/><text x="72" y="204.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#233951">Gemeinsam ein Szenario festlegen</text><rect x="98" y="236" width="1052" height="97" rx="14" fill="#EDF4FF"/><text x="119" y="267.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2B6CD4">Du</text><text x="119" y="302.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Ich möchte Dortmund / Unna mit Personenverkehr und Paketzustellung simulieren.</text><rect x="72" y="345" width="1080" height="132" rx="14" fill="#F2F6F8"/><text x="93" y="376.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#21839A">Assistent</text><text x="93" y="411.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Meinst du beide Städte oder den Korridor dazwischen? Welche Zellgröße möchtest du</text><text x="93" y="446.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">verwenden?</text><rect x="98" y="489" width="1052" height="97" rx="14" fill="#EDF4FF"/><text x="119" y="520.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2B6CD4">Du</text><text x="119" y="555.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Den Korridor dazwischen, mit 500-m-Zellen. Ich bestätige den Ausschnitt auf der Karte.</text><rect x="72" y="598" width="1080" height="132" rx="14" fill="#F2F6F8"/><text x="93" y="629.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#21839A">Assistent</text><text x="93" y="664.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Ich leite die Bevölkerung aus Zensusdaten und die Standorte aus OSM ab. Für ÖPNV prüfe</text><text x="93" y="699.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">ich verfügbare GTFS-Daten. Welche Depots und Paketmengen sollen gelten?</text><rect x="98" y="742" width="1052" height="132" rx="14" fill="#EDF4FF"/><text x="119" y="773.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2B6CD4">Du</text><text x="119" y="808.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Ein Depot setze ich selbst in Brackel. Rechne mit 0,8 Paketen je Person und Woche und</text><text x="119" y="843.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">20 % Retouren.</text><rect x="72" y="886" width="1080" height="132" rx="14" fill="#F2F6F8"/><text x="93" y="917.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#21839A">Assistent</text><text x="93" y="952.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Ich schlage eine Woche mit der vollständigen Modellbevölkerung vor. Rechts findest du</text><text x="93" y="987.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Datenquellen und Annahmen zur Prüfung.</text><rect x="98" y="1030" width="1052" height="97" rx="14" fill="#EDF4FF"/><text x="119" y="1061.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#2B6CD4">Du</text><text x="119" y="1096.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Passt. Ich möchte die Ergebnisse anschließend für MobileCity exportieren.</text><rect x="72" y="1139" width="1080" height="132" rx="14" fill="#F2F6F8"/><text x="93" y="1170.32" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#21839A">Assistent</text><text x="93" y="1205.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">Die Konfiguration ist vorbereitet. Prüfe den Kartenausschnitt und den Depotpunkt, bevor du</text><text x="93" y="1240.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#233951">das Szenario übernimmst.</text><rect x="1240" y="154" width="640" height="1272" rx="20" fill="#FFFFFF"/><text x="1276" y="209.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#233951">Szenario im Überblick</text><text x="1276" y="247.16" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#64748B">Vorschlag zur Bestätigung</text><text x="1276" y="314.92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#21839A">Gebiet &amp; Umfang</text><text x="1276" y="360.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Dortmund–Unna: bestätigter Ausschnitt</text><text x="1276" y="406.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• 500-m-Zellen in EPSG:3035</text><text x="1276" y="452.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Eine Woche · 100 % Modellbevölkerung</text><text x="1276" y="526.92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#21839A">Externe Daten</text><text x="1276" y="572.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Zensus 2022: Bevölkerung und Struktur</text><text x="1276" y="618.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• OSM: Straßen, Gebäude, Einrichtungen</text><text x="1276" y="664.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• GTFS: Verfügbarkeit wird geprüft</text><text x="1276" y="738.92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#21839A">Deine Modellannahmen</text><text x="1276" y="784.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Ein Depot: manuell gesetzter Punkt</text><text x="1276" y="830.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• 0,8 Pakete / Person / Woche</text><text x="1276" y="876.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• 20 % Retouren</text><text x="1276" y="950.92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#21839A">Modell &amp; Ziel</text><text x="1276" y="996.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• SyntheSis Mobility &amp; Logistics Model</text><text x="1276" y="1042.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Aktivitäten, Personen- und Paketnachfrage</text><text x="1276" y="1088.08" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#233951">• Ziel: Export für MobileCity</text><rect x="1276" y="1255" width="568" height="63" rx="12" fill="#2B6CD4"/><text x="1399" y="1293.92" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Szenario übernehmen</text><text x="1276" y="1356.24" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B">Gebiet und Depot auf der Karte bestätigen.</text><text x="40" y="1464.24" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B">Illustrativer Dialog. Der Szenarioassistent ist noch nicht implementiert; Werte sind Beispielannahmen.</text></svg>