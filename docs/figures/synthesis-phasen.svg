<text x="1269" y="251" class="body">Wochenpläne je Person</text>
<text x="1269" y="294" class="body">actiTopp als Standard</text>
<text x="1269" y="337" class="body">Alternativ: GTA/Vorlagen</text>
<text x="1269" y="380" class="body">Arbeit, Einkauf, Freizeit</text>
