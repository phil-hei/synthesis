<text x="1269" y="525" class="out">mit Zeiten und Dauer</text>
<path d="M1533 340H1552" fill="none" stroke="#56677d" stroke-width="3" marker-end="url(#a)"/>
<rect x="1556" y="143" width="280" height="434" rx="16" fill="#f5f8fc" stroke="#d7e0e9"/>
<rect x="1556" y="143" width="280" height="64" rx="16" fill="#d47a15" stroke="#d47a15"/>
<text x="1573" y="184" class="head">6  Netz &amp; Logistik</text>
<text x="1573" y="251" class="body">GraphHopper-Matrizen</text>
<text x="1573" y="294" class="body">Zeiten, Distanzen, Kosten</text>
<text x="1573" y="337" class="body">Depots / Paketstationen</text>
<text x="1573" y="380" class="body">Paketraten und Zustellorte</text>
<path d="M1573 421H1819" stroke="#d7e0e9"/>
<text x="1573" y="454" class="label">ERGEBNIS</text>
<text x="1573" y="493" class="out">Erreichbarkeiten und</text>
<text x="1573" y="525" class="out">Logistikeingaben</text>
<path d="M1837 340H1856" fill="none" stroke="#56677d" stroke-width="3" marker-end="url(#a)"/>
<rect x="1860" y="143" width="280" height="434" rx="16" fill="#f5f8fc" stroke="#d7e0e9"/>
<rect x="1860" y="143" width="280" height="64" rx="16" fill="#8150b1" stroke="#8150b1"/>
<text x="1877" y="184" class="head">7  Nachfrage</text>
<text x="1877" y="251" class="body">mobiTopp / logiTopp</text>
<text x="1877" y="294" class="body">Ziel- und Moduswahl</text>
<text x="1877" y="337" class="body">Private Paketaufträge</text>
<text x="1877" y="380" class="body">Zustelltouren</text>
<path d="M1877 421H2123" stroke="#d7e0e9"/>
<text x="1877" y="454" class="label">ERGEBNIS</text>
<text x="1877" y="493" class="out">Personenwege, Pakete,</text>
<text x="1877" y="525" class="out">Touren und OD-Ströme</text>
<path d="M2141 340H2160" fill="none" stroke="#56677d" stroke-width="3" marker-end="url(#a)"/>
<rect x="2164" y="143" width="280" height="434" rx="16" fill="#f5f8fc" stroke="#d7e0e9"/>
<rect x="2164" y="143" width="280" height="64" rx="16" fill="#198899" stroke="#198899"/>
<text x="2181" y="184" class="head">8  Simulation</text>
<text x="2181" y="251" class="body">SUMO-Verkehrsablauf</text>
<text x="2181" y="294" class="body">OSM-Netz + Nachfrage</text>
<text x="2181" y="337" class="body">Karten und Kennzahlen</text>
<text x="2181" y="380" class="body">Optional: Netz-Feedback</text>
<path d="M2181 421H2427" stroke="#d7e0e9"/>
<text x="2181" y="454" class="label">ERGEBNIS</text>
<text x="2181" y="493" class="out">Verkehrsbelastungen</text>
<text x="2181" y="525" class="out">und Auswertungen</text>
<rect x="36" y="617" width="1800" height="76" rx="16" fill="#eaf0f7" stroke="#d7e0e9"/>
<text x="57" y="649" class="out">Phasen 1–6 bauen das SyntheSis Mobility &amp; Logistics Model auf.</text>
<text x="57" y="679" class="body">Raum · Bevölkerung · Aktivitäten · Netze · Logistik · Quellen und Annahmen</text>
<rect x="1860" y="617" width="584" height="76" rx="16" fill="#f3edfa" stroke="#d7e0e9"/>
<text x="1880" y="649" class="out">Phasen 7–8 erzeugen Ergebnisse.</text>
<text x="1880" y="679" class="body">Nachfrage → Verkehrsablauf → Auswertung</text>
<path d="M1700 578V610" fill="none" stroke="#56677d" stroke-width="3" marker-end="url(#a)"/>
<path d="M1700 694V739" fill="none" stroke="#56677d" stroke-width="3" marker-end="url(#a)"/>
<rect x="36" y="750" width="2408" height="123" rx="16" fill="#edf7f9" stroke="#d7e0e9"/>
<text x="58" y="790" class="out">MobileCity-Export: heute nach der Vorbereitung in Phase 6, vor der Nachfragesimulation in Phase 7</text>
<text x="58" y="828" class="body">Aggregierte Eingaben + GTFS + optionale KBA-/BKG-/BNetzA-Daten + Referenzparameter → Konfiguration; native Prüfung optional.</text>
<text x="58" y="856" class="sub">Eine Übergabe der späteren logiTopp-Nachfrage ist noch abzustimmen und zu implementieren.</text>
<text x="38" y="920" class="sub">Einordnung: Fachliche Präsentationsphasen, keine zusätzlichen Softwaremodule. Zielmodelle und Zusatzquellen sind wählbar.</text>
<text x="38" y="954" class="sub">Noch offen: gebäudebasierte Wohnpunkte, gemeinsame Netzrouten für Touren, GTFS-Zeitmatrix und durchgehende Exportfreigabe.</text>
