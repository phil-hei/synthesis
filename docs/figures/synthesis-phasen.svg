<text x="661" y="251" class="body">OSM: Orte und Straßen</text>
<text x="661" y="294" class="body">Zensus: Einwohner</text>
<text x="661" y="337" class="body">Regionale Strukturen</text>
<text x="661" y="380" class="body">Optional: Pendlerdaten</text>
<path d="M661 421H907" stroke="#d7e0e9"/>
<text x="661" y="454" class="label">ERGEBNIS</text>
<text x="661" y="493" class="out">Zonale Bevölkerung</text>
<text x="661" y="525" class="out">und Zielattraktivitäten</text>
