<text x="53" y="251" class="body">Gebiet und Bezugsjahr</text>
<text x="53" y="294" class="body">Auflösung und Ziele</text>
<text x="53" y="337" class="body">Bevölkerungsvorgaben</text>
<text x="53" y="380" class="body">Logistikkonzept</text>
<path d="M53 421H299" stroke="#d7e0e9"/>
<text x="53" y="454" class="label">ERGEBNIS</text>
