<text x="357" y="294" class="body">Verkehrszellen und IDs</text>
<text x="357" y="337" class="body">Gebiet in Zellen teilen</text>
<text x="357" y="380" class="body">INSPIRE als Quellraster</text>
<path d="M357 421H603" stroke="#d7e0e9"/>
<text x="357" y="454" class="label">ERGEBNIS</text>
<text x="357" y="493" class="out">Zonen und Geometrien</text>
<text x="357" y="525" class="out">als räumlicher Bezug</text>
