<rect width="2480" height="980" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24374c}.title{font-size:38px;font-weight:700}.sub{font-size:23px;fill:#526477}.head{font-size:25px;font-weight:700;fill:white}.body{font-size:23px}.label{font-size:19px;font-weight:700;fill:#526477}.out{font-size:22px;font-weight:700}</style>
<text x="38" y="55" class="title">SyntheSis – vom Szenario zu Nachfrage und Simulation</text>
<text x="38" y="96" class="sub">Acht aufeinanderfolgende Phasen · Jede Phase entspricht einer Vertiefungsfolie · Stand 30.09.2026</text>
