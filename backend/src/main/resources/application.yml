server:
  port: 8090

spring:
  application:
    name: synthesis-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

synthesis:
  data-dir: data
  max-zones: 600
  overpass:
    endpoint: https://overpass-api.de/api/interpreter
    timeout-seconds: 30                        # allgemeines Budget (leichte POI-/Place-Queries)
    road-network-timeout-seconds: 180          # eigenes, großes Budget für den GraphHopper-Netzabruf (way[highway]+recurse)
    # mirrors:                                 # Ausweich-Endpunkte bei 504/429 (Default: kumi.systems, private.coffee)
    #   - https://overpass.kumi.systems/api/interpreter
  simulation:
    enabled: true                              # Stufe 11: logiTopp-Wochensimulation
    project-dir: ../validation/mobitopp-rastatt # Legacy-Projekt mit runDeliverySynthesis
    timeout-minutes: 30
    # calibration-iterations: 8                # max. Iterationen der Modal-Split-/Distanz-Kalibrierung
    # calibration-tolerance: 0.02              # Abbruch, wenn RMSE zum Ziel darunter liegt
    # distance-calibration-target-near-share: 0.14  # Ziel-Anteil Wege <1 km (Zielwahl b_intrazonal); Näherungswert, tunbar
    # distance-calibration-tolerance: 0.02     # Abbruch, wenn |Ist-Ziel| des <1-km-Anteils darunter
  # sumo:                                      # Zielmodell SUMO (Defaults aus $SUMO_HOME abgeleitet)
  #   enabled: true
  #   bin-dir: /pfad/zu/sumo/bin               # enthält sumo/netconvert/duarouter
  #   sumo-home: /pfad/zu/share/sumo
  #   day: 0                                   # simulierter Tag (0 = Montag)
  #   max-trips: 4000                          # Obergrenze eingespeister PKW-Trips
  #   timeout-minutes: 15
  #   feedback-max-zones: 150                  # Netz-Feedback: Zonen-Obergrenze (OD-Routing ist n²)
  #   feedback-iterations: 3                   # Gleichgewichts-Iterationen (je 1 logiTopp- + SUMO-Lauf)
  #   feedback-tolerance: 0.01                 # Konvergenz bei mittlerer Faktor-Änderung darunter
  # llm:                                       # GTA-Verhaltensquelle + LLM-Moduswahl (OpenAI-kompatibel, z. B. Ollama)
  #   enabled: true
  #   endpoint: http://localhost:11434/v1
  #   model: qwen2.5:7b-instruct
  #   temperature: 0.7
  #   timeout-seconds: 120
  #   max-personas: 60                         # Obergrenze distinkter Personas (LLM-Calls) je Lauf
  # transit:                                   # ÖV-Zielmodell (Phase C): GTFS → gtfs2pt.py → Bus-Fahrplan
  #   enabled: true
  #   venv-python: ../validation/transit-venv/bin/python  # Python-venv mit pandas/rtree/pyproj (Pflicht, sonst SKIPPED)
  #   # gtfs2pt: $SUMO_HOME/tools/import/gtfs/gtfs2pt.py   # Default aus $SUMO_HOME
  #   window-start-hour: 6                      # Fahrplan-Zuschnitt-Fenster (begrenzt gtfs2pt-Laufzeit)
  #   window-end-hour: 10
  #   max-feed-mb: 200                          # größere Auto-Fetch-Feeds → Upload empfohlen
  #   timeout-minutes: 25                       # gtfs2pt (tracemapper) ist langsam; Ergebnis wird gecacht
