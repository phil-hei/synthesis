server:
  port: 8090
  servlet:
    session:
      timeout: 12h
      cookie:
        same-site: lax
        http-only: true
  # Hinter einem Reverse-Proxy (TLS-Terminierung) werden X-Forwarded-* ausgewertet.
  forward-headers-strategy: framework

spring:
  application:
    name: synthesis-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

synthesis:
  auth:                                        # Plattform-Anmeldung (Cookie-Session, users.json im data-dir)
    enabled: true                              # false nur für lokale Einzelnutzer-Entwicklung
    allowed-origins: [http://localhost:4300]   # Dev-Server; der ausgelieferte Build läuft same-origin
    bootstrap-admin: admin                     # wird beim ersten Start ohne Konten mit Startpasswort angelegt
    min-password-length: 8
    max-login-failures: 10                     # danach Sperre je Benutzername und Herkunft
    lockout-minutes: 15
  frontend:
    dir: ""                                    # Verzeichnis des Angular-Builds; leer = classpath:/static
  # Unternehmenstouren: lokaler LLM-Vorschlag, zusätzlich zum immer manuellen Mapping.
  # company-tour-import:
  #   llm-enabled: false
  #   source-analysis-enabled: false # Explizit: Quelltexte/Tabellenproben an lokalen LLM senden
  #   document-python: python3       # Mit pypdf für PDF-Text
  #   document-extractor: ../scripts/extract-tour-document.py
  #   endpoint: http://localhost:11434/v1
  #   model: qwen2.5:7b-instruct
  #   timeout-seconds: 60
  #   geocoding-enabled: false       # Opt-in, ausschließlich lokaler Nominatim-kompatibler Dienst
  #   geocoding-endpoint: http://127.0.0.1:8585
  #   geocoding-timeout-seconds: 3
  #   geocoding-max-batch: 10
  data-dir: data
  max-zones: 600                         # Default neuer Szenarien; in der UI pro Szenario einstellbar
  max-zones-hard-limit: 1200             # Schutzgrenze, da mehrere OD-Matrizen quadratisch wachsen
  overpass:
    live-data-enabled: true                    # POIs/Orte automatisch live laden; Snapshots bleiben bei false nutzbar
    endpoint: https://overpass-api.de/api/interpreter
    timeout-seconds: 30                        # allgemeines Budget (leichte POI-/Place-Queries)
    road-network-timeout-seconds: 180          # eigenes, großes Budget für den GraphHopper-Netzabruf (way[highway]+recurse)
    # road-network-file: ../validation/rastatt-test.osm # lokales OSM-XML für reproduzierbare Offline-Routingläufe
    # mirrors:                                 # Ausweich-Endpunkte bei 504/429 (Default: kumi.systems, private.coffee)
    #   - https://overpass.kumi.systems/api/interpreter
  census:
    enabled: true
    version: zensus-2022-2024-10-08
    reference-date: 2022-05-15
    source-url: https://www.destatis.de/static/DE/zensus/gitterdaten/Zensus2022_Bevoelkerungszahl.zip
    archive-sha256: 1a8428d31eab264c8717bfdcbf40fbd66c217edb2e2a98d0e67741bd8a1a941a
    grid-entry: Zensus2022_Bevoelkerungszahl_100m-Gitter.csv
    timeout-seconds: 180
    max-archive-mb: 64
  mobile-city-validation:                     # optionale native Prüfung vollständiger Importpakete
    enabled: true
    python: python3
    script: ../scripts/validate-mobilecity.py
    dotnet: ../validation/tools/dotnet-8.0.425/dotnet
    tool-source: ../validation/mobilecity/ConfigTool
    nuget-cache: ../.runtime/nuget
    timeout-minutes: 20
    years: 11                                 # vollständiger Regionalhorizont, mindestens 3
  simulation:
    enabled: true                              # Stufe 12: logiTopp-Wochensimulation
    project-dir: ../adapters/logitopp/build/install/synthesis-logitopp-adapter # Separater SyntheSis-Adapter
    timeout-minutes: 30
    # calibration-iterations: 8                # max. Iterationen der Modal-Split-/Distanz-/Modus-Distanz-Kalibrierung
    # calibration-tolerance: 0.02              # Abbruch, wenn RMSE zum Ziel darunter liegt
    # distance-calibration-target-near-share: 0.21  # MiD 2017 A W12: 10 % <0,5 km + 11 % 0,5–<1 km
    # distance-calibration-tolerance: 0.02     # Abbruch, wenn |Ist-Ziel| des <1-km-Anteils darunter
  # sumo:                                      # Zielmodell SUMO (Defaults aus $SUMO_HOME abgeleitet)
  #   enabled: true
  #   bin-dir: /pfad/zu/sumo/bin               # enthält sumo/netconvert/duarouter
  #   sumo-home: /pfad/zu/share/sumo
  #   day: 0                                   # simulierter Tag (0 = Montag)
  #   max-trips: -1                            # Ohne Mengenlimit; positive Werte nur als Testlimit je Verkehrsart
  #   timeout-minutes: 15
  #   feedback-max-zones: 150                  # Netz-Feedback: Zonen-Obergrenze (OD-Routing ist n²)
  #   feedback-iterations: 3                   # Gleichgewichts-Iterationen (je 1 logiTopp- + SUMO-Lauf)
  #   feedback-tolerance: 0.01                 # Konvergenz bei mittlerer Faktor-Änderung darunter
  # llm:                                       # GTA-Verhaltensquelle + LLM-Moduswahl (OpenAI-kompatibel, z. B. Ollama)
  #   enabled: true
  #   endpoint: http://localhost:11434/v1
  #   model: qwen2.5:7b-instruct
  #   temperature: 0.7
  #   timeout-seconds: 120
  #   max-personas: 60                         # Obergrenze distinkter Personas (LLM-Calls) je Lauf
  transit:                                     # automatische ÖV-Ergänzung für SUMO: GTFS → gtfs2pt.py → Bus-Fahrplan
    enabled: true
    venv-python: ../validation/transit-venv/bin/python  # fehlt das reproduzierbare venv, wird ÖV verständlich übersprungen
  #   # gtfs2pt: $SUMO_HOME/tools/import/gtfs/gtfs2pt.py   # Default aus $SUMO_HOME
  #   window-start-hour: 6                      # Fahrplan-Zuschnitt-Fenster (begrenzt gtfs2pt-Laufzeit)
  #   window-end-hour: 10
  #   max-feed-mb: 200                          # größere Auto-Fetch-Feeds → Upload empfohlen
  #   timeout-minutes: 25                       # gtfs2pt (tracemapper) ist langsam; Ergebnis wird gecacht
  #   modes: bus                               # aktuell nur Bus (Netz ist road-only)
  #   feeds:                                    # Auto-Fetch-Registry (Verbund-GTFS + Abdeckungs-Bbox)
  #     - name: kvv
  #       url: https://www.nvbw.de/fileadmin/user_upload/service/open_data/fahrplandaten_mit_liniennetz/kvv.zip
  #       min-lat: 48.55
  #       min-lon: 7.95
  #       max-lat: 49.25
  #       max-lon: 8.95
  #     - name: gtfs-de-nahverkehr               # DE-weiter DELFI-ÖPNV-Feed (gtfs.de, CC BY 4.0), ~223 MB (Stand 2026-07)
  #       url: https://download.gtfs.de/germany/nv_free/latest.zip  # Default-Registry: NACH den Verbund-Feeds; braucht max-feed-mb > 223
  #       min-lat: 47.2
  #       min-lon: 5.8
  #       max-lat: 55.1
  #       max-lon: 15.1
