stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

backend-tests:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21
  cache:
    key: maven
    paths:
      - .m2/repository/
  script:
    - cd backend
    - mvn --batch-mode test
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

frontend-tests-and-build:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  script:
    - cd frontend
    - npm ci
    - npm run audit:prod
    - npm test
    - npm run build

# Native Vollprüfung auf einem projektgebundenen Shell-Runner. Der Job ist bewusst
# manuell/optional: SUMO, Ollama, die gepinnten KIT-Clones und GTFS-Fixtures sind
# nicht Bestandteil der generischen Docker-Runner.
full-runtime-tests:
  stage: test
  tags:
    - synthesis-runtime
  rules:
    - if: '$RUN_FULL_INTEGRATION == "true"'
    - when: manual
      allow_failure: true
  script:
    - scripts/verify.sh full
